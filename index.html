<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Still With Jesus</title>
<style>
  :root{
    --ink:#1c1a17;
    --paper:#f6f1e7;
    --card:#fffdf8;
    --gold:#b8862d;
    --gold-deep:#8a5f16;
    --line:#e3d8c2;
    --shadow:rgba(60,44,18,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:Georgia,'Times New Roman',serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  header{
    text-align:center;
    padding:48px 20px 28px;
    border-bottom:1px solid var(--line);
    background:
      radial-gradient(120% 80% at 50% -20%, #fbf6ec 0%, var(--paper) 70%);
  }
  header .cross{
    font-size:26px;color:var(--gold);letter-spacing:.4em;margin-bottom:12px;
  }
  header h1{
    font-size:clamp(30px,7vw,52px);
    font-weight:400;
    letter-spacing:.02em;
  }
  header h1 span{font-style:italic;color:var(--gold-deep)}
  header p{
    margin-top:12px;
    font-size:15px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:#7a6a4d;
    font-family:system-ui,Arial,sans-serif;
  }

  .grid{
    max-width:1120px;
    margin:34px auto;
    padding:0 16px 60px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
  }
  @media(min-width:820px){
    .grid{grid-template-columns:repeat(4,1fr);gap:22px}
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 2px 10px var(--shadow);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{transform:translateY(-4px);box-shadow:0 10px 22px var(--shadow)}

  .card .thumb{
    aspect-ratio:1/1;
    width:100%;
    object-fit:cover;
    display:block;
    background:#efe7d6;
  }
  .card .body{
    padding:14px 14px 16px;
    display:flex;
    flex-direction:column;
    gap:12px;
    flex:1;
  }
  .card h2{
    font-size:15px;
    font-weight:400;
    line-height:1.35;
    flex:1;
  }
  .buy{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    text-decoration:none;
    background:var(--gold);
    color:#fff;
    font-family:system-ui,Arial,sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:.08em;
    padding:10px 12px;
    border-radius:6px;
    transition:background .15s ease;
  }
  .buy:hover{background:var(--gold-deep)}
  .buy svg{width:16px;height:16px;fill:currentColor}

  footer{
    text-align:center;
    padding:26px 20px 40px;
    border-top:1px solid var(--line);
    font-family:system-ui,Arial,sans-serif;
    font-size:12px;
    color:#8a7a5d;
  }
</style>
</head>
<body>
<header>
  <div class="cross">&#10013;</div>
  <h1>Still <span>With</span> Jesus</h1>
  <p>Faith &middot; Grace &middot; Everyday Blessings</p>
</header>

<main class="grid" id="grid"></main>

<footer>
  As an Amazon Associate we earn from qualifying purchases.<br>
  &copy; 2026 Still With Jesus
</footer>

<script>
  // Replace img and url with your real Amazon affiliate data.
  const products = [
    {name:"Product 1", img:"https://placehold.co/600x600?text=1", url:"#"},
    {name:"Product 2", img:"https://placehold.co/600x600?text=2", url:"#"},
    {name:"Product 3", img:"https://placehold.co/600x600?text=3", url:"#"},
    {name:"Product 4", img:"https://placehold.co/600x600?text=4", url:"#"},
    {name:"Product 5", img:"https://placehold.co/600x600?text=5", url:"#"},
    {name:"Product 6", img:"https://placehold.co/600x600?text=6", url:"#"},
    {name:"Product 7", img:"https://placehold.co/600x600?text=7", url:"#"},
    {name:"Product 8", img:"https://placehold.co/600x600?text=8", url:"#"},
    {name:"Product 9", img:"https://placehold.co/600x600?text=9", url:"#"},
    {name:"Product 10", img:"https://placehold.co/600x600?text=10", url:"#"},
    {name:"Product 11", img:"https://placehold.co/600x600?text=11", url:"#"},
    {name:"Product 12", img:"https://placehold.co/600x600?text=12", url:"#"}
  ];

  const cart = '<svg viewBox="0 0 24 24"><path d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM6.2 6l1.2 6.4c.1.6.6 1 1.2 1h7.9c.6 0 1.1-.4 1.2-1L19 8H7.4l-.3-1.5L6.7 4H3v1.5h2.5L6.2 6z"/></svg>';

  document.getElementById('grid').innerHTML = products.map(p => `
    <article class="card">
      <img class="thumb" src="${p.img}" alt="${p.name}" loading="lazy">
      <div class="body">
        <h2>${p.name}</h2>
        <a class="buy" href="${p.url}" target="_blank" rel="nofollow noopener">
          ${cart} BUY NOW
        </a>
      </div>
    </article>
  `).join('');
</script>
</body>
</html>
